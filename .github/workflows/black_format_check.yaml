name: Format with Black
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Black
        run: python -m pip install black
      - name: Check formatting with Black
        run: black --check --diff .